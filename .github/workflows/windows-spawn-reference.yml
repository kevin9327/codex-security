name: windows-spawn-reference

on:
  push:
    branches: [dev/kyleb/python-migration-windows-spawn-reference]

permissions:
  contents: read
  actions: read

jobs:
  focused-process-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.13", "1.3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Download the verified native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "10123167710"
          run-id: "34399459006"
          github-token: ${{ github.token }}
          path: plugins/codex-security/native/prebuilt
      - name: Install dependencies and compile fixtures
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
          pnpm --dir sdk/typescript run build:ci
          pnpm --dir sdk/typescript run build:plugin
      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Install ripgrep
        run: choco install ripgrep --yes --no-progress
      - name: Test report fixtures alone
        id: report-alone
        continue-on-error: true
        working-directory: sdk/typescript
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
        run: bun test --timeout=120000 --seed=4392 tests-ts/scan-finalization.test.ts
      - name: Test report fixtures after post-scan tests
        id: report-pair
        continue-on-error: true
        working-directory: sdk/typescript
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
        run: bun test --timeout=120000 --seed=4392 tests-ts/api-post-scan.test.ts tests-ts/scan-finalization.test.ts
      - name: Test scan files after mock scans
        id: scan-pair
        continue-on-error: true
        working-directory: sdk/typescript
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
        run: bun test --timeout=120000 --seed=1494397518 tests-ts/mock-scan.test.ts tests-ts/scan-local-files.test.ts
      - name: Require all focused runs to pass
        if: always() && (steps.report-alone.outcome != 'success' || steps.report-pair.outcome != 'success' || steps.scan-pair.outcome != 'success')
        run: exit 1
