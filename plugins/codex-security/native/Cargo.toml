[package]
name = "codex-security-native"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libsqlite3-sys = { version = "=0.38.2", features = ["bundled"] }
napi = { version = "=3.12.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.3"
rustpython-sre_engine = { git = "https://github.com/RustPython/RustPython", rev = "287dcd91e9c64e302c9a6cd02f3f88f49ecf558b" }
rustpython-wtf8 = { git = "https://github.com/RustPython/RustPython", rev = "287dcd91e9c64e302c9a6cd02f3f88f49ecf558b" }

[patch."https://github.com/RustPython/RustPython"]
rustpython-unicode = { path = "unicode15" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_Console", "Win32_System_Environment", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[build-dependencies]
napi-build = "=2.4.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
